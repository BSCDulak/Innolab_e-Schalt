services:
  eschalt_db:
    image: postgres:latest
    container_name: eschalt_db
    restart: always
    environment:
      - POSTGRES_DB=eschalt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - eschalt_db:/var/lib/postgresql
    ports:
      - "5432:5432"

  # eschalt_cache:
  #   image: redis:latest
  #   container_name: eschalt_cache
  #   restart: always
  #   ports:
  #     - "6379:6379"

  eschalt_ai:
    container_name: eschalt_ai
    restart: always
    build:
      context: ./eSchalt/AIdocker
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

volumes:
  eschalt_db:
