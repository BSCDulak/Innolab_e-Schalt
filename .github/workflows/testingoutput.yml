name: C++ Hello World on Windows testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up the C++ compiler
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
          path-type: inherit

      # Step 3: Compile the program
      - name: Compile hello.cpp
        run: g++ -o hello hello.cpp

      # Step 4: Run the program and save output to file
      - name: Run the Hello World program and capture output
        run: .\hello.exe > output.txt

      # Step 5: Verify the output
      - name: Check output
        run: |
          $expected = "Hello, World!"
          $output = Get-Content -Path output.txt -Raw
          if ($output.Trim() -ne $expected) {
            Write-Error "Output does not match expected 'Hello, World!'"
          } else {
            Write-Output "Output verified successfully."
          }
        shell: pwsh
